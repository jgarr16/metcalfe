<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>Metcalfe - Move-in Inspection</title>
  <style>
    :root {
      --bg: #f0f0f0;
      --card: #fff;
      --border: #ccc;
      --text: #212529;
      --muted: #6c757d;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --touch: 44px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 0;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--card); color: var(--text); line-height: 1.4;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: var(--card);
    }
    .header {
      flex-shrink: 0;
      padding: clamp(0.45rem, 1.5vw, 0.75rem) clamp(0.75rem, 2vw, 1rem);
      background: var(--card);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .header.hidden { display: none; }
    .header h1 { font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 600; margin: 0; }
    .header .meta { font-size: 0.75rem; color: var(--muted); margin: 0.15rem 0 0 0; }

    .viewer {
      flex: 1 1 auto;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      min-height: 0;
      background: var(--card);
    }
    .image-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.25rem, 1vw, 0.75rem);
      background: #111;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .image-wrap img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; pointer-events: none; }
    .image-wrap .placeholder { color: #666; padding: 1rem; font-size: 0.9rem; text-align: center; }
    .image-wrap .loading { color: #999; }
    .image-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: clamp(2.5rem, 5vw, 3.25rem);
      height: clamp(2.5rem, 5vw, 3.25rem);
      border: 0;
      border-radius: 999px;
      background: rgba(13, 110, 253, 0.88);
      color: #fff;
      font-size: clamp(1.35rem, 3vw, 1.8rem);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.25);
    }
    .image-nav:hover { background: var(--primary-hover); }
    .image-nav:active { transform: translateY(-50%) scale(0.96); }
    .image-nav.prev { left: clamp(0.5rem, 2vw, 1rem); }
    .image-nav.next { right: clamp(0.5rem, 2vw, 1rem); }

    .nav-row {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.45rem 0.5rem; background: var(--bg); border-top: 1px solid var(--border);
    }
    .nav-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.4rem 0.75rem; min-height: var(--touch); font-size: 1.1rem; font-weight: 600;
      border: none; border-radius: 6px; background: var(--primary); color: #fff;
      cursor: pointer; line-height: 1;
    }
    .nav-btn:hover { background: var(--primary-hover); }
    .nav-btn:active { transform: scale(0.97); }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .nav-counter { font-size: 0.85rem; color: var(--muted); min-width: 3.5rem; text-align: center; }

    .details {
      overflow: auto;
      padding: clamp(0.75rem, 2vw, 1rem);
      border-top: 1px solid var(--border);
      background: var(--card);
    }
    .details .eyebrow {
      margin: 0 0 0.15rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .details h2 {
      margin: 0 0 0.75rem;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.2;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(4.75rem, max-content) minmax(0, 1fr);
      gap: 0.55rem 0.75rem;
      margin: 0;
      font-size: clamp(0.86rem, 1.7vw, 0.95rem);
    }
    .detail-grid dt {
      color: var(--muted);
      font-weight: 600;
    }
    .detail-grid dd {
      margin: 0;
      min-width: 0;
      word-wrap: break-word;
    }
    .detail-grid .empty {
      color: var(--muted);
      font-style: italic;
    }
    .details .keywords { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.75rem; }
    .details .keyword { font-size: 0.68rem; padding: 0.18rem 0.45rem; background: var(--bg); border-radius: 999px; color: var(--muted); }

    @media (min-width: 900px) {
      .viewer {
        grid-template-columns: minmax(0, 1fr) minmax(18rem, 24rem);
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .image-wrap { grid-column: 1; grid-row: 1; }
      .nav-row { grid-column: 1; grid-row: 2; }
      .details {
        grid-column: 2;
        grid-row: 1 / 3;
        border-top: 0;
        border-left: 1px solid var(--border);
      }
    }

    /* Fullscreen overlay */
    .fullscreen {
      position: fixed; inset: 0; z-index: 9999;
      background: #000; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .fullscreen.hidden { display: none; }
    .fullscreen img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .fullscreen .close {
      position: absolute; top: max(0.5rem, env(safe-area-inset-top)); right: max(0.5rem, env(safe-area-inset-right));
      width: 2.5rem; height: 2.5rem; border: none; border-radius: 50%;
      background: rgba(255,255,255,0.2); color: #fff; font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .fullscreen .close:hover { background: rgba(255,255,255,0.35); }
    .fullscreen .hint { position: absolute; bottom: max(1rem, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(255,255,255,0.6); }

    #load { margin: 0; padding: 2rem; color: var(--muted); }
    #error { margin: 0; padding: 1rem; color: #c00; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <p id="load">Loading…</p>
  <p id="error"></p>

  <div id="app" class="app" hidden>
    <header class="header" id="header">
      <h1>Metcalfe - Move-in Inspection</h1>
    </header>

    <div class="viewer">
      <div class="image-wrap" id="imageWrap">
        <button type="button" class="image-nav prev" id="imagePrev" aria-label="Previous image">&#8249;</button>
        <span class="placeholder" id="imgPlaceholder">Loading…</span>
        <img id="mainImg" alt="" hidden>
        <button type="button" class="image-nav next" id="imageNext" aria-label="Next image">&#8250;</button>
      </div>
      <div class="nav-row">
        <button type="button" class="nav-btn" id="btnPrev" aria-label="Previous">&#171;&#171;</button>
        <span class="nav-counter" id="counter"></span>
        <button type="button" class="nav-btn" id="btnNext" aria-label="Next">&#187;&#187;</button>
      </div>
      <aside class="details" aria-label="Image details">
        <p class="eyebrow" id="imageName"></p>
        <h2 id="detailTitle">Image Details</h2>
        <dl class="detail-grid">
          <dt>Room</dt>
          <dd id="room"></dd>
          <dt>Photo Date;</dt>
          <dd id="takenDate"></dd>
          <dt>Note</dt>
          <dd id="desc"></dd>
        </dl>
        <div class="keywords" id="keywords"></div>
      </aside>
    </div>
  </div>

  <div class="fullscreen hidden" id="fullscreen" aria-hidden="true">
    <button type="button" class="close" id="fullscreenClose" aria-label="Close">&#215;</button>
    <img id="fullscreenImg" alt="" src="">
    <span class="hint">Tap anywhere or press &times; to close</span>
  </div>

  <script>
    (function() {
      let data = null;
      let list = [];
      let currentIndex = 0;

      function setText(id, value, emptyText) {
        const el = document.getElementById(id);
        const hasValue = Boolean(value);
        el.textContent = hasValue ? value : emptyText;
        el.classList.toggle('empty', !hasValue);
      }

      function formatDateTaken(value) {
        if (!value) return '';
        const match = value.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
        if (!match) return value;
        const [, year, month, day, hour, minute, second] = match;
        const date = new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second));
        return new Intl.DateTimeFormat(undefined, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        }).format(date);
      }

      function showCurrent() {
        const img = list[currentIndex];
        if (!img) return;
        const mainImg = document.getElementById('mainImg');
        const placeholder = document.getElementById('imgPlaceholder');
        placeholder.hidden = true;
        placeholder.textContent = 'Loading…';
        mainImg.hidden = true;
        mainImg.alt = img.description || img.filename;
        mainImg.onload = function() {
          placeholder.hidden = true;
          mainImg.hidden = false;
        };
        mainImg.onerror = function() {
          placeholder.textContent = 'Image could not be loaded';
          placeholder.hidden = false;
          mainImg.hidden = true;
        };
        mainImg.src = img.url;

        document.getElementById('imageName').textContent = img.filename;
        document.getElementById('detailTitle').textContent = img.description || 'Image needs description';
        setText('room', img.room, 'Not set');
        setText('takenDate', formatDateTaken(img.created), 'Not available');
        setText('desc', img.description, 'No description yet');

        const kw = document.getElementById('keywords');
        kw.innerHTML = '';
        (img.keywords || []).forEach(k => {
          const span = document.createElement('span');
          span.className = 'keyword';
          span.textContent = k;
          kw.appendChild(span);
        });
        if (!(img.keywords || []).length) {
          const span = document.createElement('span');
          span.className = 'keyword';
          span.textContent = 'No keywords';
          kw.appendChild(span);
        }

        updateCounter();
        updateHeaderVisibility();
      }

      function updateCounter() {
        if (list.length === 0) {
          document.getElementById('counter').textContent = '';
          return;
        }
        document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + list.length;
      }

      function updateHeaderVisibility() {
        document.getElementById('header').classList.remove('hidden');
      }

      function updateNav() {
        document.getElementById('btnPrev').disabled = list.length <= 1;
        document.getElementById('btnNext').disabled = list.length <= 1;
      }

      function go(delta) {
        if (list.length === 0) return;
        currentIndex = (currentIndex + delta + list.length) % list.length;
        showCurrent();
      }

      function openFullscreen() {
        const img = list[currentIndex];
        if (!img) return;
        const fs = document.getElementById('fullscreen');
        const fsImg = document.getElementById('fullscreenImg');
        fsImg.src = img.url;
        fsImg.alt = img.description || img.filename;
        fs.classList.remove('hidden');
        fs.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeFullscreen() {
        const fs = document.getElementById('fullscreen');
        fs.classList.add('hidden');
        fs.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      function init() {
        document.getElementById('btnPrev').addEventListener('click', function() { go(-1); });
        document.getElementById('btnNext').addEventListener('click', function() { go(1); });
        document.getElementById('imagePrev').addEventListener('click', function(e) { e.stopPropagation(); go(-1); });
        document.getElementById('imageNext').addEventListener('click', function(e) { e.stopPropagation(); go(1); });
        document.getElementById('fullscreenClose').addEventListener('click', closeFullscreen);
        document.getElementById('fullscreen').addEventListener('click', function(e) {
          if (e.target === this || e.target.classList.contains('hint')) closeFullscreen();
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); }
          if (e.key === 'ArrowRight') { go(1); e.preventDefault(); }
          if (e.key === 'Escape') { closeFullscreen(); e.preventDefault(); }
        });

        var imageWrap = document.getElementById('imageWrap');
        var lastTap = 0;
        imageWrap.addEventListener('dblclick', openFullscreen);
        imageWrap.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTap < 350 && now - lastTap > 0) {
            e.preventDefault();
            openFullscreen();
            lastTap = 0;
            return;
          }
          lastTap = now;
        }, { passive: false });
      }

      fetch('images/index.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(r.statusText)))
        .then(json => {
          data = json;
          list = data.images;
          currentIndex = 0;
          document.getElementById('load').hidden = true;
          document.getElementById('app').hidden = false;
          if (list.length) {
            showCurrent();
            updateNav();
          } else {
            document.getElementById('imgPlaceholder').textContent = 'No images';
            document.getElementById('imgPlaceholder').hidden = false;
          }
          init();
        })
        .catch(err => {
          document.getElementById('load').hidden = true;
          document.getElementById('error').textContent = 'Could not load report: ' + err.message;
        });
    })();
  </script>
</body>
</html>
